[build]
  base = "."
  publish = "public"
  command = "npm run build"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Environment variables (set these in Netlify UI)
# WATSONX_API_KEY
# WATSONX_PROJECT_ID
# SLACK_WEBHOOK_URL
# DATABASE_URL
