name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Step 2: Setup Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pytest
    
    # Step 4: Lint with flake8
    - name: Lint with flake8
      run: |
        # Run flake8 on the actual source and test locations
        flake8 src/main.py tests/demo.py tests/test_api.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all other errors as warnings
        flake8 src/main.py tests/demo.py tests/test_api.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    # Step 5: Check code formatting with black
    - name: Check code formatting with black
      run: |
        black --check --diff src/main.py tests/demo.py tests/test_api.py
      continue-on-error: true
    
    # Step 6: Start server and run API tests
    - name: Test API endpoints
      run: |
        # Start server in background (use src/main.py)
        python src/main.py &
        SERVER_PID=$!

        # Wait for server to start
        echo "Waiting for server to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "Server is up!"
            break
          fi
          sleep 1
        done

        # Run tests (use tests/test_api.py)
        python tests/test_api.py || true

        # Stop server
        kill $SERVER_PID || true
    
    # Step 7: Health check
    - name: Server health check
      run: |
        # Start server in background (use src/main.py)
        python src/main.py &
        SERVER_PID=$!

        # Wait and check health
        sleep 5
        curl -f http://localhost:8000/health || exit 1

        # Stop server
        kill $SERVER_PID || true
